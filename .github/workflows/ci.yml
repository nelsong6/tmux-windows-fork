name: Windows CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      # tmux.exe loads conpty.dll and OpenConsole.exe from its own folder
      # (the pseudoconsole Windows Terminal ships); the package carries them.
      CONPTY_VERSION: 1.25.260930003

    steps:
      - uses: actions/checkout@v4

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" -Force

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-windows-static-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: vcpkg-x64-windows-static-

      - name: Setup vcpkg and install dependencies
        shell: pwsh
        run: |
          vcpkg install libevent:x64-windows-static

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build --config Debug

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Run basic regression tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-basic.sh

      - name: Run Claude swarm simulation tests
        shell: bash
        run: |
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-claude-swarm.sh

      - name: Run format string tests
        shell: bash
        run: |
          taskkill //F //IM tmux.exe 2>/dev/null || true
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-format-strings.sh

      - name: Run config syntax tests
        shell: bash
        run: |
          taskkill //F //IM tmux.exe 2>/dev/null || true
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-conf-syntax.sh

      - name: Run key handling tests
        shell: bash
        timeout-minutes: 5
        run: |
          taskkill //F //IM tmux.exe 2>/dev/null || true
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-keys.sh

      - name: Run has-session tests
        shell: bash
        run: |
          taskkill //F //IM tmux.exe 2>/dev/null || true
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-has-session.sh

      - name: Run file tests
        shell: bash
        run: |
          taskkill //F //IM tmux.exe 2>/dev/null || true
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-file.sh

      - name: Run layout tests
        shell: bash
        run: |
          taskkill //F //IM tmux.exe 2>/dev/null || true
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-layout.sh

      - name: Run control client tests
        shell: bash
        run: |
          taskkill //F //IM tmux.exe 2>/dev/null || true
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-control-client.sh

      - name: Run attach size tests
        shell: bash
        run: |
          taskkill //F //IM tmux.exe 2>/dev/null || true
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-attach-size.sh

      - name: Run wrap tests
        shell: bash
        run: |
          taskkill //F //IM tmux.exe 2>/dev/null || true
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-wrap.sh

      - name: Run palette tests
        shell: bash
        run: |
          taskkill //F //IM tmux.exe 2>/dev/null || true
          TEST_TMUX=./build/Debug/tmux.exe bash regress/win32-palette.sh

      - name: Fetch ConPTY
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Windows.Console.ConPTY/$env:CONPTY_VERSION" -OutFile conpty.zip
          Expand-Archive conpty.zip conpty

      # A console changes hands only through conpty.dll, so the Debug build
      # runs here beside it, as a release does.
      - name: Run upgrade tests
        shell: bash
        run: |
          taskkill //F //IM tmux.exe 2>/dev/null || true
          mkdir -p build/upgrade
          cp build/Debug/tmux.exe conpty/runtimes/win-x64/native/conpty.dll conpty/build/native/runtimes/x64/OpenConsole.exe build/upgrade/
          TEST_TMUX=./build/upgrade/tmux.exe bash regress/win32-upgrade.sh

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tmux-windows-debug
          path: |
            build/Debug/tmux.exe

      - name: Package Release with ConPTY
        shell: pwsh
        run: |
          New-Item -ItemType Directory package | Out-Null
          Copy-Item build/Release/tmux.exe, conpty/runtimes/win-x64/native/conpty.dll, conpty/build/native/runtimes/x64/OpenConsole.exe package/

      - name: Upload Release package
        uses: actions/upload-artifact@v4
        with:
          name: tmux-windows
          path: package/

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - uses: actions/checkout@v4

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" -Force

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-windows-static-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: vcpkg-x64-windows-static-

      - name: Setup vcpkg and install dependencies
        shell: pwsh
        run: |
          vcpkg install libevent:x64-windows-static

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Package release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "tmux-windows-$version.zip"
          $stagingDir = "release-staging"

          New-Item -ItemType Directory -Path $stagingDir
          Copy-Item build/Release/tmux.exe $stagingDir/

          Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipName

          # Generate SHA256
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          "$hash  $zipName" | Out-File -Encoding UTF8 "$zipName.sha256"

          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "ZIP_HASH=$hash" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          body: |
            ## tmux for Windows ${{ github.ref_name }}

            **SHA256:** `${{ env.ZIP_HASH }}`

            ### Installation
            1. Download `${{ env.ZIP_NAME }}`
            2. Extract to a folder in your `%PATH%`
            3. Run `tmux new-session`

            ### Requirements
            - Windows 10 version 1809+
            - Windows Terminal or VT-capable console

            ### What's included
            - `tmux.exe` (statically linked, single-file)

            See [README_WIN32.MD](https://github.com/arndawg/tmux-windows/blob/master/README_WIN32.MD) for full documentation.
          generate_release_notes: true
